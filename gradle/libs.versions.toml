# Semua versi di bawah diverifikasi terhadap Google Maven / Maven Central pada 2026-08-29.
# Jangan menyalin version catalog dari prd-plan-1.md / prd-plan-2.md — keduanya usang.
[versions]
agp = "9.3.0"
# Kotlin/KSP mengikuti versi yang di-embed AGP 9.3.0 (KGP 2.2.10, KSP 2.2.10-2.0.2).
# AGP 9 punya built-in Kotlin, jadi plugin org.jetbrains.kotlin.android TIDAK dipakai.
kotlin = "2.2.10"
ksp = "2.2.10-2.0.2"
composeBom = "2026.08.00"
hilt = "2.60.1"
# Satu jalur versi untuk SELURUH artefak androidx.hilt: hilt-navigation-compose,
# hilt-lifecycle-viewmodel-compose, hilt-work, dan hilt-compiler. Sebelum Fase 6
# kunci ini bernama `hiltNavigationCompose`, nama yang jadi menyesatkan begitu
# hilt-work ikut memakainya. Diverifikasi terhadap Google Maven 2026-08-31.
androidxHilt = "1.4.0"
# WorkManager (Fase 6). Stabil terbaru per 2026-08-31 menurut maven-metadata.xml
# Google Maven. Dipakai untuk memeriksa cuaca ekstrem secara berkala.
workManager = "2.11.2"
room = "2.8.4"
coreKtx = "1.19.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigationCompose = "2.10.0"
datastore = "1.2.1"
coroutines = "1.11.0"
okhttp = "5.5.0"
retrofit = "3.0.0"
# Dipin di 1.9.0 secara sadar. Fakta yang sudah diuji (2026-08-29):
#   - Gradle module metadata: 1.11.0 menuntut kotlin-stdlib 2.3.20,
#     1.10.0 menuntut 2.3.0, 1.9.0 menuntut 2.2.0.
#   - 1.9.0 adalah rilis terakhir yang sejalan dengan Kotlin 2.2.10 (versi
#     compiler yang di-embed AGP 9.3.0 dan dipakai project ini).
#   - CATATAN JUJUR: 1.11.0 SUDAH DIUJI dan ternyata tetap compile, karena
#     Hilt 2.60.1 sudah menarik kotlin-stdlib 2.3.21 ke dependency graph
#     sehingga syarat 2.3.20 terpenuhi tanpa kita naikkan apa pun.
#     Jadi menaikkan versi di sini BUKAN kegagalan otomatis seperti KSP di
#     Fase 1 — itu perbandingan yang keliru.
# Alasan tetap di 1.9.0: menyamai jalur Kotlin milik compiler adalah pilihan
# konservatif, dan tidak ada fitur 1.10/1.11 yang dibutuhkan Fase 2. Kalau
# suatu saat perlu naik, itu boleh — cukup jalankan assembleRelease juga,
# karena R8 + serializer adalah titik gagal yang sebenarnya.
kotlinxSerialization = "1.9.0"
coil = "2.7.0"
timber = "5.0.1"
desugar = "2.1.5"
# Firebase AI Logic (Fase 5). BoM menentukan versi firebase-ai dan
# firebase-appcheck-debug — jangan tulis versi pada keduanya di [libraries].
firebaseBom = "34.18.0"
# Plugin google-services punya jalur rilis sendiri, TIDAK diatur BoM Firebase.
googleServices = "4.4.4"
# Plugin Crashlytics (Fase 8) juga punya jalur rilis sendiri — alasan yang sama
# dengan googleServices di atas. Diverifikasi terhadap maven-metadata.xml Google
# Maven 2026-09-02: latest = release = 3.0.8, lastUpdated 2026-08-19.
# JANGAN menyamakannya dengan versi artefak firebase-crashlytics (20.1.0) —
# keduanya angka yang sama sekali berbeda dan mudah tertukar.
crashlyticsPlugin = "3.0.8"
# Kover 0.9.9 (17 Juli 2026). Mengukur coverage host test (unit test JVM);
# instrumented test TIDAK ikut terhitung -- lihat exclusion di app/build.gradle.kts.
kover = "0.9.9"
junit = "4.13.2"
mockk = "1.14.11"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"

# Fase 4: deteksi penyakit padi on-device.
# TensorFlow Lite runtime + support (ImageProcessor/TensorImage). TIDAK diatur
# BoM Firebase — versi eksplisit wajib. Diverifikasi terhadap Maven Central saat
# implementasi. Catatan: TFLite di-rebrand jadi LiteRT (com.google.ai.edge.litert);
# jalur org.tensorflow:tensorflow-lite dipilih karena itu yang dipakai contoh
# resmi Firebase model-downloader — jangan campur dua jalur.
# JANGAN turunkan. Runtime harus >= versi op yang dipancarkan konverter Colab:
# model kita (dynamic-range quant) memakai FULLY_CONNECTED v12. register.cc
# mencatat max_version 11 di 2.16.1 dan 12 di 2.17.0 — 2.16.1 gagal saat
# Interpreter dibuat ("Didn.t find op for builtin opcode FULLY_CONNECTED v12").
# 2.17.0 = rilis terakhir org.tensorflow:tensorflow-lite di Maven Central.
tensorflowLite = "2.17.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "androidxHilt" }
hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "androidxHilt" }
# @HiltWorker. androidx-hilt-compiler BUKAN hilt-compiler milik Dagger di atas —
# keduanya dibutuhkan berbarengan dan sama-sama lewat ksp(). Menghapus salah
# satunya membuat @HiltWorker tidak menghasilkan kode, dan kegagalannya baru
# muncul saat worker dijalankan, bukan saat build.
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "androidxHilt" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "androidxHilt" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "workManager" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugar" }

# Firebase AI Logic — kunci Gemini tetap di server Firebase, tidak pernah di APK.
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-ai = { group = "com.google.firebase", name = "firebase-ai" }
# App Check ditegakkan otomatis untuk AI Logic sejak Juli 2026; debug provider
# dipakai HANYA di build debug (lihat AgriBicaraApp).
firebase-appcheck-debug = { group = "com.google.firebase", name = "firebase-appcheck-debug" }
# Fase 8. Provider App Check untuk build RILIS. Tanpa ini build rilis tidak punya
# provider sama sekali dan setiap panggilan Gemini ditolak saat runtime meskipun
# build sukses. BoM 34.18.0 memin 19.4.1 — sama dengan appcheck-debug, dan tetap
# TIDAK ditulis di sini.
firebase-appcheck-playintegrity = { group = "com.google.firebase", name = "firebase-appcheck-playintegrity" }
# Fase 8. Crashlytics: crash di perangkat petani sampai ke developer tanpa petani
# perlu melapor. BoM memin 20.1.0; versinya tetap tidak ditulis.
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }
# Fase 4. Runtime TFLite (Interpreter). Model di-bundel di assets aplikasi
# (Firebase ML Model Hosting deprecated/shutdown Juni 2027). Pra-proses manual.
tensorflow-lite = { group = "org.tensorflow", name = "tensorflow-lite", version.ref = "tensorflowLite" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# version.ref = kotlin (2.2.10) — plugin serialization SELALU mengikuti versi Kotlin.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
# Mengunggah mapping R8 otomatis supaya stack trace rilis terbaca, bukan
# ter-obfuscate. Tanpa plugin ini artefak firebase-crashlytics tetap mengirim
# crash, tetapi isinya tidak bisa dibaca siapa pun.
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "crashlyticsPlugin" }
