org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true

# KSP (symbol-processing-gradle-plugin 2.2.10-2.0.2) mendaftarkan source hasil generate
# lewat kotlin.sourceSets, yang ditolak built-in Kotlin AGP 9. Flag resmi ini
# mengizinkannya. Tinjau ulang saat KSP merilis versi yang sadar built-in Kotlin.
android.disallowKotlinSourceSets=false

# org.gradle.tooling.parallel dari sync Android Studio dibuang di sini: bukan
# properti Gradle, diam-diam tidak berefek, dan org.gradle.parallel di atas sudah
# menyalakan paralelisme yang sesungguhnya.
org.gradle.configuration-cache=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
